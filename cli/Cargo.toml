[workspace]
members = [
    "crates/hitop-core",
    "crates/hitop",
    "crates/hitop-git",
    "crates/hitop-sync-crypto",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]
license = "MIT"
repository = "https://github.com/bohdaq/hitop"
homepage = "https://github.com/bohdaq/hitop"


[workspace.dependencies]
hitop-core = { path = "crates/hitop-core", version = "1.2.0" }
hitop-sync-crypto = { path = "crates/hitop-sync-crypto", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
boa_engine = "0.22"
dirs = "5"
thiserror = "1"
anyhow = "1"

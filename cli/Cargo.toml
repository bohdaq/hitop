[workspace]
members = [
    "crates/hitop-core",
    "crates/hitop",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]
license = "MIT"
repository = "https://github.com/bohdaq/hitop"
homepage = "https://github.com/bohdaq/hitop"

[workspace.metadata.dist]
# cargo-dist: build and release binaries on git tag push
cargo-dist-version = "0.22.1"
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[workspace.dependencies]
hitop-core = { path = "crates/hitop-core", version = "0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
boa_engine = "0.19"
dirs = "5"
thiserror = "1"
anyhow = "1"

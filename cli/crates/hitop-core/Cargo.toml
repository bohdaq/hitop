[package]
name = "hitop-core"
description = "Core library of HITOP, the API client your terminal, your CI and your AI agent can all drive: collections, variables, scripting, runs"
keywords = ["http", "api", "client", "rest", "scripting"]
categories = ["web-programming::http-client", "api-bindings"]
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }
boa_engine = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
regex = "1"
# serde_yaml is deprecated and serde_yml is unsound (RUSTSEC-2025-0068);
# yaml_serde is serde_yaml continued by the YAML organization.
yaml_serde = "0.10.7"
# OS keychain for secret variables: macOS Keychain, Windows Credential Manager, and the
# Secret Service over zbus on Linux (pure Rust, so static musl builds keep working).
keyring = { version = "4.2", optional = true }
# WebSocket connections (src/websocket.rs, feature `websocket`): tokio-tungstenite over
# rustls with the ring provider and the webpki roots, as reqwest uses (no OpenSSL).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "sync", "time", "macros"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
# Request timing (src/timing.rs): reqwest's connector-layer and resolver hooks are tower
# services; both crates are already in the tree through hyper and reqwest.
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
# `${secret:aws:...}` (src/secret_managers.rs): SigV4's SHA-256 and HMAC. ring is
# already in the tree through rustls, so the AWS SDK isn't needed.
ring = { version = "0.17", optional = true }
# gRPC calls (src/grpc.rs, feature `grpc`): tonic over rustls (ring, webpki roots), dynamic
# messages through prost-reflect, schemas from server reflection (tonic-reflection's
# generated v1 and v1alpha clients) or .proto files parsed at run time by protox (no protoc).
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"], optional = true }
tonic-reflection = { version = "0.14.6", default-features = false, optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
prost-reflect = { version = "0.16", features = ["serde"], optional = true }
protox = { version = "0.10", optional = true }

[features]
default = ["keychain", "native", "websocket", "grpc", "secret-managers"]
# HTTP (reqwest), scripts (boa), the runner and the JSON storage in the
# config directory. Off for wasm32 (hitop-wasm: the format module and the
# model in the web app).
native = ["dep:reqwest", "scripting", "dep:dirs", "dep:ring", "dep:tokio", "dep:tower-service", "dep:tower-layer"]
# Pre/post request scripts alone (src/scripting.rs: boa + the pm.* shim), without HTTP or storage:
# hitop-scripts-wasm builds it for the Firefox extension, which may not evaluate code in its pages.
scripting = ["dep:boa_engine"]
# WebSocket connections (src/websocket.rs's client): the CLI's `hitop ws` and the desktop.
websocket = ["native", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:webpki-roots"]
# gRPC calls (src/grpc.rs's client): the CLI's `hitop grpc` and the desktop.
grpc = ["native", "dep:tokio", "dep:futures-util", "dep:tonic", "dep:tonic-reflection", "dep:prost", "dep:prost-types", "dep:prost-reflect", "dep:protox"]
# `${secret:vault|aws|azure|op:...}` references resolved at run time
# (src/secret_managers.rs). Off for wasm32: the web app can't reach them.
secret-managers = ["native", "dep:ring"]
# Off for targets without an OS keychain (the future wasm build).
keychain = ["dep:keyring"]
# The opt-in weekly usage ping (src/telemetry.rs). Off by default: the CLI and the
# GitHub Release desktop builds turn it on; Mac App Store builds and the web app
# (hitop-wasm) never contain it.
telemetry = ["native"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
proptest = "1"
httpmock = "0.8.3"
# tests/grpc.rs: a local tonic server (tests/support/grpc_server.rs) with reflection.
tonic = { version = "0.14.6", default-features = false, features = ["transport", "router"] }
tonic-reflection = { version = "0.14.6", default-features = false, features = ["server"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
prost-reflect = { version = "0.16", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

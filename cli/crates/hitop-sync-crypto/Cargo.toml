[package]
name = "hitop-sync-crypto"
version = "0.1.0"
edition = "2021"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]
license = "MIT"
description = "Client-side end-to-end encryption for hitop sync: HPKE key wrapping and XChaCha20-Poly1305 blobs"
repository = "https://github.com/bohdaq/hitop"
# Published to crates.io before hitop (release-cli.yml), which depends on it for `hitop sync`.
keywords = ["hpke", "encryption", "e2ee", "sync"]
categories = ["cryptography"]

[dependencies]
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
zeroize = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

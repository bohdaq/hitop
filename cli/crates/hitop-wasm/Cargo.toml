[package]
name = "hitop-wasm"
version = "0.1.0"
edition = "2021"
description = "hitop-core's collection format and model for the web app (wasm32, wasm-bindgen)"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]
license = "MIT"
repository = "https://github.com/bohdaq/hitop"
publish = false

# Its own workspace: a separate Cargo.lock and target dir, so the CLI
# workspace (and `cargo publish`) never sees it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hitop-core = { path = "../hitop-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# hitop sync's client crypto (src/sync.rs) and base64url for its values.
hitop-sync-crypto = { path = "../hitop-sync-crypto", features = ["serde"] }
base64 = "0.22"
# Must match the wasm-bindgen CLI version exactly (webapp/scripts/build-wasm.mjs).
wasm-bindgen = "=0.2.126"

# The browser's crypto.getRandomValues for the sync keys and nonces (getrandom 0.4 needs only
# the feature; hitop-wasm already depends on wasm-bindgen).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Password hashing (hitop-sync-crypto) unoptimized makes the tests slow.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

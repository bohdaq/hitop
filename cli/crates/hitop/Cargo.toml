[package]
name = "hitop"
description = "HITOP: the API client your terminal, your CI and your AI agent can all drive. Send requests, run collections in CI, serve them over MCP"
keywords = ["http", "api", "client", "rest", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hitop"
path = "src/main.rs"

# cargo binstall hitop: the GitHub Release binaries (release-cli.yml). Linux builds are static
# musl, so gnu targets use them too.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cli-v{ version }/hitop-{ target }.tar.gz"
bin-dir = "hitop-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/cli-v{ version }/hitop-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "hitop-x86_64-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/cli-v{ version }/hitop-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "hitop-aarch64-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/cli-v{ version }/hitop-x86_64-pc-windows-msvc.zip"
pkg-fmt = "zip"

[dependencies]
hitop-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
indicatif = "0.18"
rpassword = "7.5"
# `hitop mcp`: the official MCP SDK, stdio transport only.
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "net"] }
# `hitop ws`: binary messages as base64 in --json output.
base64 = "0.22"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }

[features]
default = ["telemetry"]
# `hitop telemetry on|off|status` and the weekly ping (off until turned on).
telemetry = ["hitop-core/telemetry"]

[dev-dependencies]
assert_cmd = "2"
httpmock = "0.8.3"
predicates = "3"
roxmltree = "0.21.2"
tempfile = "3"
# tests/secret_managers.rs: seeds the Vault and LocalStack dev servers.
reqwest = { workspace = true }
# tests/ws.rs: a local WebSocket echo server.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# tests/grpc.rs: hitop-core's local tonic test server (tests/support/grpc_server.rs).
tonic = { version = "0.14.6", default-features = false, features = ["transport", "router"] }
tonic-reflection = { version = "0.14.6", default-features = false, features = ["server"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
prost-reflect = { version = "0.16", features = ["serde"] }

[package]
name = "hitop-scripts-wasm"
version = "0.1.0"
edition = "2021"
description = "hitop-core's pre/post request scripts (boa + the pm.* shim) for the Firefox extension (wasm32, wasm-bindgen)"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]
license = "MIT"
repository = "https://github.com/bohdaq/hitop"
publish = false

# Its own workspace, like hitop-wasm: a separate Cargo.lock and target dir. Only the Firefox
# extension loads it (Firefox has no sandboxed extension pages, so its pages may not evaluate code).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hitop-core = { path = "../hitop-core", default-features = false, features = ["scripting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen CLI version exactly (webapp/scripts/build-wasm.mjs).
wasm-bindgen = "=0.2.126"

# boa on wasm32-unknown-unknown: Date and Math.random through the browser (web-time, getrandom).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "0.22", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "hitop-server"
version = "0.1.0"
edition = "2021"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]
license = "MIT"
description = "Serves hitop.rws8.tech, the web app's request proxy (POST /api/proxy) and opt-in usage pings (POST /api/ping)"
publish = false

[dependencies]
# The WebSocket bridge (wsbridge.rs): hitop-core's WebSocket client (tokio-tungstenite + rustls).
hitop-core = { path = "../cli/crates/hitop-core", default-features = false, features = ["websocket"] }
rust-web-server = { version = "18.30", default-features = false, features = ["http2", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
sha2 = "0.10"
getrandom = "0.3"

[profile.release]
lto = true
strip = true

[dev-dependencies]
# The WebSocket bridge test's upstream echo server (wsbridge.rs).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

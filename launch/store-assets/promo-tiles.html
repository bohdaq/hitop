<!doctype html>
<!-- Chrome Web Store promo tiles: small 440×280 (#small) and marquee 1400×560 (#marquee).
     Rendered to PNG by webapp/tests/store-shots.cjs (element screenshots); open in a browser to preview.
     Fonts: Geist from webapp/node_modules (npm ci in webapp/); the mark is brand/logo.svg inline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>HITOP promo tiles</title>
<style>
  @font-face { font-family: "Geist"; src: url("../../webapp/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../../webapp/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #0a0a0c; --text: #f4f3f8; --muted: #b9b6c8; --g1: #667eea; --g2: #764ba2; --primary: #a99cff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #222; display: grid; gap: 24px; justify-content: start; font-family: "Geist", system-ui, sans-serif; color: var(--text); }
  .tile { position: relative; overflow: hidden; background: var(--bg); }
  /* The brand gradient as light behind the mark. */
  .tile::before { content: ""; position: absolute; inset: 0; background:
      radial-gradient(60% 80% at 0% 0%, rgba(102, 126, 234, 0.38), transparent 70%),
      radial-gradient(60% 90% at 100% 100%, rgba(118, 75, 162, 0.45), transparent 70%); }
  .tile > * { position: relative; }
  .mark { display: block; }
  .name { font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin: 0; }
  .tagline { color: var(--muted); margin: 0; font-weight: 450; }
  .tagline b { color: var(--text); font-weight: 600; }

  #small { width: 440px; height: 280px; padding: 34px 36px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  #small .brand { display: flex; align-items: center; gap: 16px; }
  #small .mark { width: 72px; height: 72px; }
  #small .name { font-size: 58px; }
  #small .tagline { font-size: 21px; line-height: 1.3; }
  #small .rule { width: 56px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--g1), var(--g2)); }

  #marquee { width: 1400px; height: 560px; display: grid; grid-template-columns: 580px 1fr; align-items: center; }
  #marquee .copy { padding: 0 0 0 80px; display: grid; gap: 26px; }
  #marquee .brand { display: flex; align-items: center; gap: 22px; }
  #marquee .mark { width: 96px; height: 96px; }
  #marquee .name { font-size: 84px; }
  #marquee .tagline { font-size: 29px; line-height: 1.3; max-width: 440px; }
  #marquee .chips { display: flex; flex-wrap: wrap; gap: 10px; max-width: 460px; }
  #marquee .chips span { font-family: "Geist Mono", ui-monospace, monospace; font-size: 17px; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(169, 156, 255, 0.35); color: var(--primary); background: rgba(169, 156, 255, 0.08); }
  #marquee .shot { justify-self: start; width: 1000px; margin-top: 70px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(102, 126, 234, 0.25); }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
    <symbol id="logo" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="url(#grad1)" />
      <path d="M 18 20 L 18 44 M 18 32 L 28 32 M 28 20 L 28 44" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 36 24 L 36 40 L 48 32 Z" fill="white" />
    </symbol>
  </defs>
</svg>

<div class="tile" id="small">
  <div class="brand">
    <svg class="mark" aria-hidden="true"><use href="#logo" /></svg>
    <p class="name">HITOP</p>
  </div>
  <div class="rule"></div>
  <p class="tagline">The API client your terminal, your CI and your AI agent can all drive.</p>
</div>

<div class="tile" id="marquee">
  <div class="copy">
    <div class="brand">
      <svg class="mark" aria-hidden="true"><use href="#logo" /></svg>
      <p class="name">HITOP</p>
    </div>
    <p class="tagline">The API client your terminal,<br>your CI and your AI agent<br>can all drive.</p>
    <div class="chips"><span>REST</span><span>GraphQL</span><span>WebSocket</span><span>SSE</span><span>pm.* scripts</span><span>hitop run</span></div>
  </div>
  <img class="shot" src="screenshot-1-request.png" alt="">
</div>
</body>
</html>

[package]
name = "hitop-desktop"
version = "1.0.0"
edition = "2021"
description = "HITOP desktop app"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]
license = "MIT"

[lib]
name = "hitop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hitop-core = { path = "../../cli/crates/hitop-core" }
# The Git panel (status, commit, branches, pull/push, conflicts) over vendored libgit2.
hitop-git = { path = "../../cli/crates/hitop-git" }

# Mac App Store build: security-scoped bookmarks so the sandboxed app can reopen
# collection folders on the next launch (src/bookmarks.rs). Same versions Tauri uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"] }

[features]
# The opt-in weekly usage ping (hitop-core's telemetry module). Off by default, so
# the Mac App Store build (a plain `tauri build`) doesn't contain it;
# release-desktop.yml turns it on for the GitHub Release builds.
telemetry = ["hitop-core/telemetry"]

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

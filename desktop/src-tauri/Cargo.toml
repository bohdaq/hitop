[package]
name = "hitop-desktop"
version = "0.1.0"
edition = "2021"
description = "HITOP desktop app"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]

[lib]
name = "hitop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hitop-core = { path = "../../cli/crates/hitop-core" }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

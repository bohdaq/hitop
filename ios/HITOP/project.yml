# XcodeGen spec for HITOP for iOS 26 (ios/HITOP_IOS.md). It replaces the live App Store app
# (ios/HiTop, App Store id6785326628) and ships as its update: same bundle id
# hitop.rws8.tech.HiTop, version above the live 1.0 (1).
#   brew install xcodegen && cd ios/HITOP && xcodegen generate && open HITOPApp.xcodeproj
# The .xcodeproj is generated (git-ignored); this file is the source. CI: .github/workflows/ios.yml.
#
# macOS file systems are case-insensitive: this folder (ios/HITOP) and the old app's (ios/HiTop)
# are the same folder on a Mac. Nothing in here may case-fold onto the old tree's names
# (HiTop/, HiTopTests/, HiTopUITests/, HiTop.xcodeproj), hence App/, UnitTests/, UITests/ and the
# project name HITOPApp.
name: HITOPApp
options:
  bundleIdPrefix: hitop.rws8.tech
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  HitopKit:
    path: ../HitopKit
settings:
  base:
    DEVELOPMENT_TEAM: XD7JHZ5DB3
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # SyncFFI (Rust, module CHitopSync): the module map here, the libraries in
    # Vendor/HitopSyncFFI.xcframework (scripts/build-sync-ffi.sh xcframework, before xcodegen).
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/SyncFFI/include
targets:
  HITOP:
    type: application
    platform: iOS
    sources:
      - path: App
      # Live Activity attributes, widget views, entities and the widget's intents: also in HITOPWidgets.
      - path: Shared
    dependencies:
      - package: HitopKit
      - framework: Vendor/HitopSyncFFI.xcframework
        embed: false
      - target: HITOPWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hitop.rws8.tech.HiTop
        PRODUCT_NAME: HITOP
        PRODUCT_MODULE_NAME: HITOP
        INFOPLIST_FILE: App/Info.plist
        # App group group.hitop.rws8.tech.HiTop (the widget snapshot): register it for both
        # bundle ids in the developer portal before a signed build (ios/HITOP_IOS.md I3).
        CODE_SIGN_ENTITLEMENTS: App/HITOP.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  # Widgets, the collection run Live Activity + Dynamic Island, the Control Center control. It
  # reads the snapshot the app writes into the app group and runs nothing itself (its buttons'
  # intents are LiveActivityIntents, performed in the app). Not HitopKit, not App/Core: only the
  # self-contained App/Core/WidgetData.swift.
  HITOPWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/Core/WidgetData.swift
      - path: App/Resources/Fonts
        buildPhase: resources
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hitop.rws8.tech.HiTop.Widgets
        PRODUCT_NAME: HITOPWidgets
        PRODUCT_MODULE_NAME: HITOPWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/HITOPWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  HITOPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
      # The published hitop sync test vectors (SyncCoreTests), as a folder in the test bundle.
      - path: ../../cli/crates/hitop-sync-crypto/vectors
        type: folder
        buildPhase: resources
      # spec/compat/v1/run-report/report.json (RunsTests: the report reader).
      - path: ../../spec/compat/v1/run-report
        type: folder
        buildPhase: resources
    dependencies:
      - target: HITOP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hitop.rws8.tech.HiTopTests
        GENERATE_INFOPLIST_FILE: YES
  HITOPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: HITOP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hitop.rws8.tech.HiTopUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HITOP
schemes:
  HITOP:
    build:
      targets:
        HITOP: all
        HITOPTests: [test]
        HITOPUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HITOPTests
        - HITOPUITests

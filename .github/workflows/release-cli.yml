name: Release CLI

# Publishes hitop-core, then hitop, to crates.io when a tag like cli-v0.2.0
# is pushed. Needs a crates.io API token in the CARGO_REGISTRY_TOKEN secret.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the workspace version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "cli-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - run: cargo test --locked
      - name: Publish hitop-core
        run: cargo publish --locked -p hitop-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish hitop (once crates.io has the new hitop-core)
        run: |
          for i in $(seq 12); do cargo publish --locked -p hitop && exit 0; sleep 10; done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

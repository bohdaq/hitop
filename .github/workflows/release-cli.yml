name: Release CLI

# A tag like cli-v0.3.0 publishes hitop-sync-crypto (when its version is new), hitop-core, then hitop, to crates.io (CARGO_REGISTRY_TOKEN
# secret), builds hitop for five targets, attaches them to a GitHub Release and pushes the
# multi-arch image ghcr.io/bohdaq/hitop:<version> and :latest, plus <version>-debug and :debug
# (cli/docker/Dockerfile.debug: busybox shell, for GitLab CI and other shell-based runners).
# Tags with a suffix (cli-v0.3.0-rc.1) are dry runs: no crates.io publish (only --dry-run), a
# pre-release, and the image tagged with the rc version only.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag, version and tests
    runs-on: ubuntu-24.04
    # The same test setup as ci.yml's cli job: dev servers for tests/secret_managers.rs (${secret:vault:...}, ${secret:aws:...}).
    services:
      vault:
        image: hashicorp/vault:1.20.4
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          SKIP_SETCAP: "true"
        ports: ["8200:8200"]
        options: --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health" --health-interval 2s --health-timeout 5s --health-retries 15
      localstack:
        image: localstack/localstack:4.4
        env:
          SERVICES: secretsmanager
        ports: ["4566:4566"]
        options: --health-cmd "curl -fs http://localhost:4566/_localstack/health" --health-interval 3s --health-timeout 5s --health-retries 30
    env:
      HITOP_TEST_VAULT_ADDR: http://127.0.0.1:8200
      HITOP_TEST_VAULT_TOKEN: dev-root
      HITOP_TEST_LOCALSTACK_URL: http://127.0.0.1:4566
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: v
        name: Tag matches the workspace version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#cli-v}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "${tag%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            test "$tag" = "$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: sync server for tests/sync.rs
        run: |
          cargo build --locked --manifest-path ../sync-server/Cargo.toml
          echo "HITOP_SYNC_SERVER_BIN=$GITHUB_WORKSPACE/sync-server/target/debug/hitop-sync-server" >> "$GITHUB_ENV"
      # tests/sync.rs `hitop sync login --sso` through Keycloak (the sync-server's test realm).
      - name: Keycloak for tests/sync.rs
        run: |
          docker run -d --name keycloak -p 127.0.0.1:18080:8080 \
            -v "$GITHUB_WORKSPACE/sync-server/tests/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4.2 start-dev --import-realm
          echo "HITOP_SYNC_TEST_KEYCLOAK=http://127.0.0.1:18080" >> "$GITHUB_ENV"
      - name: actionlint (tests/schedule.rs lints the workflows hitop schedule writes)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$dir/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  $dir/$tgz" | sha256sum -c -
          tar -xzf "$dir/$tgz" -C "$dir" actionlint
          "$dir/actionlint" --version
          echo "HITOP_ACTIONLINT=$dir/actionlint" >> "$GITHUB_ENV"
      - run: cargo test --locked

  publish:
    name: crates.io
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry run (pre-release tag)
        if: needs.check.outputs.prerelease == 'true'
        run: cargo publish --locked --dry-run -p hitop-sync-crypto && cargo publish --locked --dry-run -p hitop-core
      # hitop sync's client crypto: versioned on its own, so publish it only when crates.io
      # doesn't have this version yet.
      - name: Publish hitop-sync-crypto (when its version is new)
        if: needs.check.outputs.prerelease != 'true'
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hitop-sync-crypto") | .version')
          if curl -fsS -A "hitop-release (github.com/bohdaq/hitop)" "https://crates.io/api/v1/crates/hitop-sync-crypto/$v" >/dev/null 2>&1; then
            echo "hitop-sync-crypto $v is already on crates.io"
          else
            cargo publish --locked -p hitop-sync-crypto
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish hitop-core
        if: needs.check.outputs.prerelease != 'true'
        run: cargo publish --locked -p hitop-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish hitop (once crates.io has the new hitop-core)
        if: needs.check.outputs.prerelease != 'true'
        run: |
          for i in $(seq 12); do cargo publish --locked -p hitop && exit 0; sleep 10; done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    name: Binary (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl): they run on any distribution and in the image.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: cli
        run: cargo build --locked --release -p hitop --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="hitop-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          cp "cli/target/${{ matrix.target }}/release/hitop$ext" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hitop-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: GitHub Release
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [ "${{ needs.check.outputs.prerelease }}" = true ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" $flags --title "hitop CLI ${{ needs.check.outputs.version }}" \
            --notes "Install with \`cargo install hitop\`, \`cargo binstall hitop\`, \`docker run ghcr.io/bohdaq/hitop:${{ needs.check.outputs.version }}\`, or download a binary below. Linux builds are static (musl)." \
            assets/*

  image:
    name: Image ghcr.io/bohdaq/hitop
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hitop-*-linux-musl
          path: assets
          merge-multiple: true
      - name: Unpack per architecture
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair#*:}-unknown-linux-musl
            mkdir -p "image/$arch"
            tar xzf "assets/hitop-$target.tar.gz" -C image
            mv "image/hitop-$target/hitop" "image/$arch/hitop"
          done
          cp cli/docker/Dockerfile cli/docker/Dockerfile.debug image/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        run: |
          v="${{ needs.check.outputs.version }}"
          tags="ghcr.io/bohdaq/hitop:$v"
          debug="ghcr.io/bohdaq/hitop:$v-debug"
          if [ "${{ needs.check.outputs.prerelease }}" != true ]; then
            tags="$tags,ghcr.io/bohdaq/hitop:latest"
            debug="$debug,ghcr.io/bohdaq/hitop:debug"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "debug=$debug" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/bohdaq/hitop
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=HITOP
            org.opencontainers.image.description=HITOP: the API client your terminal, your CI and your AI agent can all drive
      - uses: docker/build-push-action@v6
        with:
          context: image
          file: image/Dockerfile.debug
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.debug }}
          labels: |
            org.opencontainers.image.source=https://github.com/bohdaq/hitop
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=HITOP (debug)
            org.opencontainers.image.description=HITOP with a busybox shell, for shell-based CI runners such as GitLab CI
      - name: The image runs a collection
        run: |
          docker run --rm ghcr.io/bohdaq/hitop:${{ needs.check.outputs.version }} --version
          cli/docker/smoke.sh ghcr.io/bohdaq/hitop:${{ needs.check.outputs.version }}
      - name: The debug image runs a collection from a shell, as GitLab CI does
        run: |
          image=ghcr.io/bohdaq/hitop:${{ needs.check.outputs.version }}-debug
          cli/docker/smoke.sh "$image"
          docker run --rm --entrypoint "" "$image" sh -c 'hitop --version && command -v hitop'

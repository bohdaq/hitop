name: Release CLI

# A tag like cli-v0.3.0 publishes hitop-core, then hitop, to crates.io (CARGO_REGISTRY_TOKEN
# secret), builds hitop for five targets, attaches them to a GitHub Release and pushes the
# multi-arch image ghcr.io/bohdaq/hitop:<version> and :latest.
# Tags with a suffix (cli-v0.3.0-rc.1) are dry runs: no crates.io publish (only --dry-run), a
# pre-release, and the image tagged with the rc version only.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag, version and tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: v
        name: Tag matches the workspace version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#cli-v}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "${tag%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            test "$tag" = "$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo test --locked

  publish:
    name: crates.io
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry run (pre-release tag)
        if: needs.check.outputs.prerelease == 'true'
        run: cargo publish --locked --dry-run -p hitop-core
      - name: Publish hitop-core
        if: needs.check.outputs.prerelease != 'true'
        run: cargo publish --locked -p hitop-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish hitop (once crates.io has the new hitop-core)
        if: needs.check.outputs.prerelease != 'true'
        run: |
          for i in $(seq 12); do cargo publish --locked -p hitop && exit 0; sleep 10; done
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    name: Binary (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl): they run on any distribution and in the image.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: cli
        run: cargo build --locked --release -p hitop --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="hitop-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          cp "cli/target/${{ matrix.target }}/release/hitop$ext" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hitop-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: GitHub Release
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [ "${{ needs.check.outputs.prerelease }}" = true ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" $flags --title "hitop CLI ${{ needs.check.outputs.version }}" \
            --notes "Install with \`cargo install hitop\`, \`cargo binstall hitop\`, \`docker run ghcr.io/bohdaq/hitop:${{ needs.check.outputs.version }}\`, or download a binary below. Linux builds are static (musl)." \
            assets/*

  image:
    name: Image ghcr.io/bohdaq/hitop
    needs: [check, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hitop-*-linux-musl
          path: assets
          merge-multiple: true
      - name: Unpack per architecture
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair#*:}-unknown-linux-musl
            mkdir -p "image/$arch"
            tar xzf "assets/hitop-$target.tar.gz" -C image
            mv "image/hitop-$target/hitop" "image/$arch/hitop"
          done
          cp cli/docker/Dockerfile image/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        run: |
          tags="ghcr.io/bohdaq/hitop:${{ needs.check.outputs.version }}"
          [ "${{ needs.check.outputs.prerelease }}" != true ] && tags="$tags,ghcr.io/bohdaq/hitop:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/bohdaq/hitop
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=hitop: run HTTP API collections from the command line and in CI
      - name: The image runs a collection
        run: |
          docker run --rm ghcr.io/bohdaq/hitop:${{ needs.check.outputs.version }} --version
          cli/docker/smoke.sh ghcr.io/bohdaq/hitop:${{ needs.check.outputs.version }}

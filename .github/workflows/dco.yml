# Every commit in a pull request must carry a Signed-off-by line (Developer Certificate of
# Origin, see CONTRIBUTING.md). Bots are exempt.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Commits are signed off
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            case "$author" in *'[bot]'*) continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -qiE "^Signed-off-by: .+ <.+@.+>"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git rebase --signoff $BASE && git push --force-with-lease (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "All commits are signed off."

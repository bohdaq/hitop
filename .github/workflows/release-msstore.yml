name: Release Microsoft Store

# The Microsoft Store (MSIX) build of the desktop app, x64. Windows people get HITOP from the Store,
# which signs the package itself: no code-signing certificate here. The GitHub .exe/.msi downloads
# (release-desktop.yml) stay unsigned and update themselves; this build has neither the usage ping nor
# the updater (the Store updates it), and the exe inside the package is grepped to prove it.
#
# Its own workflow, not a job in release-desktop.yml: it never touches that release (its assets,
# latest.json, the `updater` job or "Latest"), a failure here doesn't hold the GitHub builds back, and
# a manual run rebuilds the package for a Partner Center resubmission without a new tag.
#
# Output: a run artifact only, never a release asset. The store package is unsigned and only Partner
# Center can use it; the test package is self-signed and only for testing. Neither is for people.
#
# Identity: repository variables MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER (CN=...) and
# MSSTORE_PUBLISHER_DISPLAY_NAME (Partner Center → the app → Product identity). Without them the job
# builds a TEST-ONLY package with a placeholder identity, signed with a throwaway self-signed
# certificate made in the job (its .cer is in the artifact, to trust it on a test machine).
# Optional upload: job `submit` puts the package into a draft submission (never committed: the owner
# submits it in Partner Center) when the MSSTORE_TENANT_ID, MSSTORE_CLIENT_ID, MSSTORE_CLIENT_SECRET
# and MSSTORE_SELLER_ID secrets and the MSSTORE_PRODUCT_ID variable are set; otherwise it says so and
# stops. Owner steps: launch/microsoft-store.md.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      submit:
        description: Also upload the store package to a Partner Center draft submission (needs the MSSTORE_* secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: MSIX package (x64)
    runs-on: windows-2022
    outputs:
      mode: ${{ steps.layout.outputs.mode }}
      file: ${{ steps.layout.outputs.file }}
      version: ${{ steps.layout.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Git Bash runs the shell scripts below: keep LF line endings in the checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          # wasm32 for hitop-wasm, which the web app (the desktop UI) builds first.
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@0.2.126
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          key: msstore
      - name: Tag and version
        id: tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')
          tag="${GITHUB_REF_NAME#desktop-v}"
          # desktop-v1.4.0-rc.1 builds 1.4.0.0 as a dry run; a release tag must match tauri.conf.json.
          if [ "$tag" != "${tag%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, tauri.conf.json $version"; exit 1
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - working-directory: desktop
        run: npm ci
      - working-directory: webapp
        run: npm ci
      # tauri.conf.json as is (the store configuration: no updater endpoint or key) and no Cargo
      # features (no `telemetry`, no `updater`, no `github`: store mode, no purchase call to action), like the Mac App Store build. --no-bundle: the MSIX
      # is made below; Tauri has no MSIX target.
      - name: Build the store exe
        working-directory: desktop
        run: npx tauri build --no-bundle
      - name: Find the exe
        id: exe
        shell: bash
        run: |
          set -euo pipefail
          dir=desktop/src-tauri/target/release
          found=()
          for name in hitop-desktop.exe HITOP.exe; do [ -f "$dir/$name" ] && found+=("$dir/$name"); done
          ls -la "$dir"/*.exe || true
          if [ "${#found[@]}" -ne 1 ]; then echo "::error::expected one app exe in $dir, found ${#found[@]}: ${found[*]:-}"; exit 1; fi
          echo "path=${found[0]}" >> "$GITHUB_OUTPUT"
      - name: No usage ping or updater in the store exe
        shell: bash
        run: desktop/scripts/check-store-binary.sh store "${{ steps.exe.outputs.path }}" "store exe"
      # Identity values go through env, never into the script text: a publisher holds commas and quotes.
      - name: Package layout (manifest, exe, images)
        id: layout
        shell: bash
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          node desktop/msstore/make-layout.mjs --exe "${{ steps.exe.outputs.path }}" --out "$RUNNER_TEMP/layout" --arch x64
          test -s "$RUNNER_TEMP/layout/AppxManifest.xml" || { echo "::error::make-layout.mjs wrote no AppxManifest.xml"; exit 1; }
          grep -q '^file=' "$GITHUB_OUTPUT" || { echo "::error::make-layout.mjs set no outputs"; exit 1; }
          if grep -q '^mode=test$' "$GITHUB_OUTPUT"; then
            echo "::warning::No MSSTORE_IDENTITY_NAME/MSSTORE_PUBLISHER/MSSTORE_PUBLISHER_DISPLAY_NAME variables: this is a TEST-ONLY package (placeholder identity, self-signed). Partner Center won't take it."
          fi
      # MakeAppx, MakePri and SignTool from the newest Windows 10/11 SDK on the runner image.
      - name: Windows SDK tools
        shell: pwsh
        run: |
          $bin = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName 'x64\makeappx.exe')) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $bin) { throw "no Windows SDK with makeappx.exe" }
          $x64 = Join-Path $bin.FullName 'x64'
          foreach ($t in 'makeappx.exe', 'makepri.exe', 'signtool.exe') { if (-not (Test-Path (Join-Path $x64 $t))) { throw "no $t in $x64" } }
          Write-Output "Windows SDK $($bin.Name): $x64"
          Add-Content $env:GITHUB_PATH $x64
      - name: resources.pri (scale and targetsize variants of the images)
        shell: pwsh
        run: |
          $layout = Join-Path $env:RUNNER_TEMP 'layout'
          makepri new /pr $layout /cf desktop\msstore\priconfig.xml /mn (Join-Path $layout 'AppxManifest.xml') /of (Join-Path $layout 'resources.pri') /o
          if ($LASTEXITCODE -ne 0) { throw "makepri failed" }
          $extra = Get-ChildItem $layout -Filter '*.pri' | Where-Object Name -ne 'resources.pri'
          if ($extra) { throw "makepri split resources into $($extra.Name -join ', '): one resources.pri expected" }
      - name: Pack (MakeAppx validates the manifest against the schema)
        shell: pwsh
        env:
          FILE: ${{ steps.layout.outputs.file }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          makeappx pack /d (Join-Path $env:RUNNER_TEMP 'layout') /p "out\$env:FILE" /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }
      # Test package only: a throwaway certificate whose subject is the manifest's placeholder
      # Publisher. Its private key never leaves this job; the .cer goes into the artifact.
      - name: Sign the test package (self-signed, test only)
        if: steps.layout.outputs.mode == 'test'
        shell: pwsh
        env:
          FILE: ${{ steps.layout.outputs.file }}
          PUBLISHER: ${{ steps.layout.outputs.publisher }}
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER -KeyUsage DigitalSignature `
            -FriendlyName 'HITOP MSIX test package (throwaway)' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddDays(90) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'test.pfx'
          $password = [guid]::NewGuid().ToString()
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath 'out\hitop-TEST-ONLY.cer' | Out-Null
          signtool sign /fd SHA256 /f $pfx /p $password "out\$env:FILE"
          $code = $LASTEXITCODE
          Remove-Item $pfx -Force
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          if ($code -ne 0) { throw "signtool failed" }
          $sig = Get-AuthenticodeSignature "out\$env:FILE"
          if ($sig.SignerCertificate.Subject -ne $env:PUBLISHER) { throw "signed by '$($sig.SignerCertificate.Subject)', manifest Publisher '$env:PUBLISHER'" }
          @"
          HITOP $($env:FILE): TEST ONLY. Never upload this to Partner Center or give it to people.

          It has a placeholder identity ($env:PUBLISHER) and is signed with a throwaway self-signed
          certificate made by the workflow run. To install it on a test machine (Windows 10 2004+ or 11):

            1. In an administrator PowerShell, trust the certificate for this machine:
                 Import-Certificate -FilePath .\hitop-TEST-ONLY.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
            2. Install:  Add-AppxPackage .\$env:FILE
               (if it names a missing Microsoft.VCLibs.140.00.UWPDesktop dependency, install
               https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx first; the Store does that itself)
            3. Afterwards remove both: Remove-AppxPackage (Get-AppxPackage tech.rws8.hitop.test).PackageFullName
               and the certificate from Local Machine > Trusted People (certlm.msc).

          The Store build is made the same way once the MSSTORE_* repository variables are set
          (launch/microsoft-store.md).
          "@ | Set-Content -Encoding utf8 'out\README-TEST-ONLY.txt'
      # What was packed, read back: the exe inside the package has no ping or updater, the manifest
      # carries the identity and version the layout step chose.
      - name: Check the package
        shell: bash
        env:
          # MakeAppx's /p and /d switches must reach it as they are, not as Git Bash paths.
          MSYS_NO_PATHCONV: "1"
          FILE: ${{ steps.layout.outputs.file }}
          NAME: ${{ steps.layout.outputs.name }}
          VERSION: ${{ steps.layout.outputs.version }}
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/unpacked"
          makeappx.exe unpack /p "out/$FILE" /d "$(cygpath -w "$unpacked")" /o
          desktop/scripts/check-store-binary.sh store "$unpacked/hitop.exe" "hitop.exe in $FILE"
          grep -q "Name=\"$NAME\"" "$unpacked/AppxManifest.xml" || { echo "::error::manifest identity is not $NAME"; exit 1; }
          grep -q "Version=\"$VERSION\"" "$unpacked/AppxManifest.xml" || { echo "::error::manifest version is not $VERSION"; exit 1; }
          test -s "$unpacked/resources.pri" || { echo "::error::no resources.pri in the package"; exit 1; }
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.layout.outputs.mode == 'test' && format('hitop-msstore-{0}-x64-TEST-ONLY', steps.layout.outputs.version) || format('hitop-msstore-{0}-x64', steps.layout.outputs.version) }}
          path: out/
          if-no-files-found: error
          retention-days: 30

  # Optional: the store package into a Partner Center draft submission (msstore CLI, Microsoft's
  # submission API client). --noCommit: the owner reviews and submits it in Partner Center. The API
  # works only once the app's first submission was made by hand in Partner Center.
  submit:
    name: Partner Center draft submission
    needs: package
    if: >-
      needs.package.outputs.mode == 'store' &&
      ((github.event_name == 'push' && needs.package.outputs.prerelease == 'false') || (github.event_name == 'workflow_dispatch' && inputs.submit))
    runs-on: windows-2022
    steps:
      - name: Credentials
        id: creds
        shell: bash
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          if [ -z "$TENANT" ] || [ -z "$CLIENT" ] || [ -z "$SECRET" ] || [ -z "$SELLER" ] || [ -z "$PRODUCT" ]; then
            echo "::notice::No MSSTORE_TENANT_ID/MSSTORE_CLIENT_ID/MSSTORE_CLIENT_SECRET/MSSTORE_SELLER_ID secrets or MSSTORE_PRODUCT_ID variable: upload the package from the run's artifact in Partner Center by hand"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.skip == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hitop-msstore-${{ needs.package.outputs.version }}-x64
          path: msstore
      - if: steps.creds.outputs.skip == 'false'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4 (was setup-msstore-cli)
        with:
          version: v0.4.4
      - name: Upload to a draft submission
        if: steps.creds.outputs.skip == 'false'
        shell: pwsh
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID }}
          FILE: ${{ needs.package.outputs.file }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }
          # The .msix itself is the "project": msstore's MSIXProjectPublisher takes a .msix/.msixupload path.
          # publish replaces a pending draft with one made from the last published submission.
          msstore publish "msstore\$env:FILE" -id $env:PRODUCT --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }
          Write-Output "::notice::$env:FILE is in a draft submission: review and submit it in Partner Center"

# HITOP for Android → Google Play internal testing, by hand (Actions → "Android Play" → Run workflow).
# Builds the release AAB signed with the upload key, checks it (bundletool validate, both ABIs,
# signature, 16 KB pages) and uploads it to the internal track. It never touches another track:
# promoting a release is done in Play Console by the owner. Setup: android/PLAY_STORE.md.
# Secrets: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS,
# ANDROID_UPLOAD_KEY_PASSWORD (optional), PLAY_SERVICE_ACCOUNT_JSON, HITOP_GOOGLE_SERVER_CLIENT_ID.
name: Android Play

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code (empty: 1000 + this workflow's run number). Higher than every earlier upload."
        required: false
        default: ""
      status:
        description: "Release status on the internal track (draft while the app has never been reviewed)"
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: android-play
  cancel-in-progress: false

env:
  NDK_VERSION: "28.2.13676358"
  CARGO_NDK_VERSION: "4.1.2"
  BUNDLETOOL_VERSION: "1.18.3"
  BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29

jobs:
  upload:
    name: Build, sign, upload to the internal track
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Upload key and client id from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CLIENT_ID: ${{ secrets.HITOP_GOOGLE_SERVER_CLIENT_ID }}
          VERSION_INPUT: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS PLAY_JSON CLIENT_ID; do
            [ -n "${!v}" ] || { echo "::error::a secret for $v is not set (android/PLAY_STORE.md, GitHub secrets)"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "HITOP_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks"
            echo "HITOP_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "HITOP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "HITOP_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "HITOP_GOOGLE_SERVER_CLIENT_ID=$CLIENT_ID"
            echo "HITOP_VERSION_CODE=${VERSION_INPUT:-$((1000 + RUN_NUMBER))}"
          } >> "$GITHUB_ENV"
      - name: Rust targets, NDK, cargo-ndk, bundletool
        run: |
          (cd cli && rustup show)
          rustup target add aarch64-linux-android x86_64-linux-android
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          echo "BUNDLETOOL=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"
      - name: Release AAB (signed with the upload key, checked)
        working-directory: android
        run: scripts/build-release.sh
      - name: Play service account
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
      - name: Upload to the internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: tech.rws8.hitop
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.status }}
      - name: Remove the key files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (hitop, hitop-core)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cargo test --locked

  server:
    name: Site server and proxy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked

  web:
    name: Site and web app (end to end)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build site, web app and server
        run: ./deploy/build.sh
      - name: Install Playwright's Chromium
        working-directory: webapp
        run: npx playwright install --with-deps chromium
      - name: Start hitop-server
        working-directory: deploy/out/www
        run: |
          RWS_CONFIG_IP=127.0.0.1 RWS_CONFIG_PORT=7879 RWS_CONFIG_DIRECTORY_LISTING=false \
          HITOP_ALLOWED_ORIGINS=http://localhost:7879 ../hitop-server > ../server.log 2>&1 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:7879/ > /dev/null && exit 0; sleep 1; done
          cat ../server.log; exit 1
      - name: End-to-end checks (they call example.com and jsonplaceholder.typicode.com)
        working-directory: webapp
        run: BASE=http://localhost:7879 npm run test:e2e

  extension:
    name: Browser extension build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:extension

  desktop:
    name: Desktop app compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Frontend (Tauri embeds ../dist)
        working-directory: desktop
        run: npm ci && npm run build
      - working-directory: desktop/src-tauri
        run: cargo check --locked

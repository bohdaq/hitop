name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (hitop, hitop-core)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    # Dev servers for tests/secret_managers.rs (${secret:vault:...}, ${secret:aws:...}).
    services:
      vault:
        image: hashicorp/vault:1.20.4
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          SKIP_SETCAP: "true"
        ports: ["8200:8200"]
        options: --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health" --health-interval 2s --health-timeout 5s --health-retries 15
      localstack:
        image: localstack/localstack:4.4
        env:
          SERVICES: secretsmanager
        ports: ["4566:4566"]
        options: --health-cmd "curl -fs http://localhost:4566/_localstack/health" --health-interval 3s --health-timeout 5s --health-retries 30
    env:
      HITOP_TEST_VAULT_ADDR: http://127.0.0.1:8200
      HITOP_TEST_VAULT_TOKEN: dev-root
      HITOP_TEST_LOCALSTACK_URL: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli
            cli/crates/hitop-wasm
            sync-server
      # tests/sync.rs: two hitop clients against a real sync server on localhost (only run, never
      # linked: the server is AGPL, the CLI MIT).
      - name: sync server for tests/sync.rs
        run: |
          cargo build --locked --manifest-path ../sync-server/Cargo.toml
          echo "HITOP_SYNC_SERVER_BIN=$GITHUB_WORKSPACE/sync-server/target/debug/hitop-sync-server" >> "$GITHUB_ENV"
      # tests/sync.rs `hitop sync login --sso` through Keycloak (the sync-server's test realm).
      - name: Keycloak for tests/sync.rs
        run: |
          docker run -d --name keycloak -p 127.0.0.1:18080:8080 \
            -v "$GITHUB_WORKSPACE/sync-server/tests/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4.2 start-dev --import-realm
          echo "HITOP_SYNC_TEST_KEYCLOAK=http://127.0.0.1:18080" >> "$GITHUB_ENV"
      - name: actionlint (tests/schedule.rs lints the workflows hitop schedule writes)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$dir/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  $dir/$tgz" | sha256sum -c -
          tar -xzf "$dir/$tgz" -C "$dir" actionlint
          "$dir/actionlint" --version
          echo "HITOP_ACTIONLINT=$dir/actionlint" >> "$GITHUB_ENV"
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:18080/realms/hitop/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - run: cargo test --locked
      # HITOP Cloud C1: the same client flows against a server with the hosted Free plan limits
      # on (HITOP_SYNC_LIMITS=plans, as the test server runs).
      - name: tests/sync.rs against a server with plan limits
        run: HITOP_SYNC_LIMITS=plans cargo test --locked -p hitop --test sync
      - name: hitop schedule --github output passes actionlint
        run: |
          repo="$RUNNER_TEMP/schedule-repo"
          mkdir -p "$repo/.git"
          cp -r fixtures/sample "$repo/sample"
          cargo run --locked -q -p hitop -- schedule "$repo/sample" --github --env prod
          cargo run --locked -q -p hitop -- schedule "$repo/sample" --github --env local --cron "*/30 8-18 * * 1-5" --hitop-version 1.0.0
          ls "$repo/.github/workflows"
          "$HITOP_ACTIONLINT" "$repo"/.github/workflows/*.yml
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: hitop-core without the native feature (what the web app builds)
        run: cargo clippy --locked -p hitop-core --no-default-features --all-targets -- -D warnings
      - name: hitop-wasm (its own workspace)
        working-directory: cli/crates/hitop-wasm
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

  server:
    name: Site server and proxy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo test --locked

  sync-server:
    name: Sync server
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sync-server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sync-server
      # SSO tests (tests/keycloak.rs) run against a real Keycloak with the test realm. A step,
      # not a service: services can't pass the container its command (start-dev --import-realm).
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 127.0.0.1:18080:8080 \
            -v "$PWD/tests/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4.2 start-dev --import-realm
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:18080/realms/hitop/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - run: cargo test --locked --workspace
        env:
          HITOP_SYNC_TEST_KEYCLOAK: http://127.0.0.1:18080
      - run: cargo test --locked --features postgres --test postgres
        env:
          HITOP_SYNC_TEST_POSTGRES: postgres://postgres:ci@127.0.0.1:5432/postgres
          # dump/restore with the server's major version (C2 backups).
          HITOP_SYNC_TEST_PG_DUMP: docker run --rm -i --network host -e PGPASSWORD postgres:17-alpine pg_dump
          HITOP_SYNC_TEST_PG_RESTORE: docker run --rm -i --network host -e PGPASSWORD postgres:17-alpine pg_restore
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  sync-server-image:
    # HITOP Cloud C6: the image release-sync-server.yml signs and pushes on cli-v* tags, built here
    # without pushing (from the repository root: the server's Cargo.toml names the client crate),
    # then the same smoke test (/healthz on a fresh volume, support-bundle inside the container).
    name: Sync server image (build and smoke test, no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sync-server/Dockerfile
          load: true
          tags: hitop-sync-server:ci
          cache-from: type=gha,scope=sync-server-image
          cache-to: type=gha,mode=max,scope=sync-server-image
      - run: sync-server/deploy/image-smoke.sh hitop-sync-server:ci

  ops:
    # HITOP Cloud C2 (spec/CLOUD_SERVICE.md): the VM scripts without a VM. Backups to a directory and
    # to an S3 API (LocalStack), restore drills on SQLite and Postgres, cutover to Postgres and back,
    # postgres-setup.sh in ubuntu:24.04, disk alerts, the status feeder, systemd-analyze on the units.
    name: Ops scripts (backups, restore drill, Postgres cutover, units)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
      localstack:
        image: localstack/localstack:4.4
        env:
          SERVICES: s3
        ports: ["4566:4566"]
        options: --health-cmd "curl -fs http://localhost:4566/_localstack/health" --health-interval 3s --health-timeout 5s --health-retries 30
    env:
      BIN: sync-server/target/debug/hitop-sync-server
      HITOP_SYNC_TEST_POSTGRES: postgres://postgres:ci@127.0.0.1:5432/postgres
      HITOP_SYNC_TEST_PG_DUMP: docker run --rm -i --network host -e PGPASSWORD postgres:17-alpine pg_dump
      HITOP_SYNC_TEST_PG_RESTORE: docker run --rm -i --network host -e PGPASSWORD postgres:17-alpine pg_restore
      HITOP_SYNC_TEST_PSQL: docker run --rm -i --network host -e PGPASSWORD postgres:17-alpine psql
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sync-server
      - name: age
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Build the sync server (with Postgres)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked --features postgres --manifest-path sync-server/Cargo.toml
      - name: Backups, restore drills, alerts, status feeder, units
        env:
          S3_ENDPOINT: http://127.0.0.1:4566
          S3_ACCESS_KEY_ID: test
          S3_SECRET_ACCESS_KEY: test
        run: cloud/ops/test/ops-e2e.sh
      - name: Cutover to Postgres and rollback
        run: cloud/ops/test/cutover-sim.sh
      - name: postgres-setup.sh in ubuntu:24.04
        run: cloud/ops/test/postgres-setup-docker.sh

  web:
    name: Site and web app (end to end)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            cli/crates/hitop-wasm
            cli
            sync-server
      - name: Build site, web app and server
        run: ./deploy/build.sh
      # HITOP Cloud C3: the security page's sentences, no "no subscription" promise, legal drafts
      # stay drafts (site/scripts/check-pages.mjs).
      - name: Site checks
        working-directory: site
        run: node scripts/check-pages.mjs
      # curl -fsSL https://hitop.rws8.tech/install.sh | sh: the newest CLI release and a pinned one,
      # under sh and dash, into a temporary folder (SHA-256 checked by the script).
      - name: CLI install script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh -n site/public-assets/install.sh
          d=$(mktemp -d)
          HITOP_INSTALL_DIR="$d/a" sh site/public-assets/install.sh
          "$d/a/hitop" --version
          HITOP_VERSION=1.1.0 HITOP_INSTALL_DIR="$d/b" dash site/public-assets/install.sh
          "$d/b/hitop" --version | grep -q '^hitop 1.1.0'
      # tests/sync.cjs: two people in the app against a real sync server (web and desktop modes).
      - name: Sync server for tests/sync.cjs
        run: |
          cargo build --locked --manifest-path sync-server/Cargo.toml
          echo "HITOP_SYNC_SERVER_BIN=$GITHUB_WORKSPACE/sync-server/target/debug/hitop-sync-server" >> "$GITHUB_ENV"
      # tests/sync.cjs: Sign in with SSO through Keycloak (the sync-server's test realm).
      - name: Keycloak for tests/sync.cjs
        run: |
          docker run -d --name keycloak -p 127.0.0.1:18080:8080 \
            -v "$GITHUB_WORKSPACE/sync-server/tests/fixtures/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.4.2 start-dev --import-realm
          echo "HITOP_SYNC_TEST_KEYCLOAK=http://127.0.0.1:18080" >> "$GITHUB_ENV"
      - name: Unit checks
        working-directory: webapp
        run: npm run test:unit
      - name: Install Playwright's Chromium
        working-directory: webapp
        run: npx playwright install --with-deps chromium
      - name: Start hitop-server
        working-directory: deploy/out/www
        run: |
          RWS_CONFIG_IP=127.0.0.1 RWS_CONFIG_PORT=7879 RWS_CONFIG_DIRECTORY_LISTING=false \
          HITOP_ALLOWED_ORIGINS=http://localhost:7879 ../hitop-server > ../server.log 2>&1 &
          for i in $(seq 30); do curl -fs http://127.0.0.1:7879/ > /dev/null && exit 0; sleep 1; done
          cat ../server.log; exit 1
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:18080/realms/hitop/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - name: End-to-end checks (they call example.com, jsonplaceholder.typicode.com and httpbin.org)
        working-directory: webapp
        run: BASE=http://localhost:7879 npm run test:e2e
      # HITOP Cloud C1: the web app's sync flow, unchanged, against a server with the hosted Free
      # plan limits on.
      - name: tests/sync.cjs against a server with plan limits
        working-directory: webapp
        run: HITOP_SYNC_LIMITS=plans BASE=http://localhost:7879 node tests/sync.cjs
      - name: HITOP Cloud portal (cloud/portal, e2e against the sync server)
        working-directory: cloud/portal
        run: npm ci --no-audit --no-fund && npm test
      - name: hitop-git for the mocked desktop (tests/git.cjs runs the Git panel through it)
        working-directory: cli
        run: cargo build --locked -p hitop-git --example git-json --no-default-features
      - name: Web app built for the desktop (Tauri adapter, mocked invoke)
        working-directory: webapp
        run: npm run build:tauri && npm run test:e2e:tauri
      - name: No usage ping in the web app (dist/ and the web adapter)
        working-directory: webapp
        run: node scripts/check-no-telemetry.mjs

  compat:
    # HITOP Cloud C1 (spec/CLOUD_SERVICE.md): every released hitop CLI since 1.1.0, the binary from
    # GitHub Releases (not this tree), runs the whole sync flow unchanged against this commit's
    # sync server (migration 4, organizations) with the hosted Free plan limits on.
    name: Released CLIs against this sync server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sync-server
      - name: Build the sync server
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked --manifest-path sync-server/Cargo.toml
      - name: Each released hitop (cli-v1.1.0 and later, no pre-releases) runs cloud/compat/released-cli.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease | not) | .tagName' | grep '^cli-v' | sort -V)"
          tested=0
          for tag in $tags; do
            v="${tag#cli-v}"
            [ "$(printf '%s\n' 1.1.0 "$v" | sort -V | head -n 1)" = 1.1.0 ] || continue
            dir="$RUNNER_TEMP/$tag"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p 'hitop-x86_64-unknown-linux-musl.tar.gz*' -D "$dir"
            (cd "$dir" && sha256sum -c hitop-x86_64-unknown-linux-musl.tar.gz.sha256 && tar -xzf hitop-x86_64-unknown-linux-musl.tar.gz)
            echo "::group::$tag"
            cloud/compat/released-cli.sh "$dir/hitop-x86_64-unknown-linux-musl/hitop" sync-server/target/debug/hitop-sync-server
            echo "::endgroup::"
            tested=$((tested + 1))
          done
          echo "tested $tested released version(s)"
          test "$tested" -ge 1

  launch-gate:
    # ROADMAP T11: a Postman user's first CI run, through the container image built from this
    # commit and bohdaq/hitop-action. Import a collection and two environments, run each
    # environment (logging in, the token passed on by pm.environment.set), check the JUnit file.
    name: Launch gate (Postman import, environments, login, action, JUnit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: musl
      - name: Build hitop (static, as in the release image)
        working-directory: cli
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --locked -p hitop --target x86_64-unknown-linux-musl
      - name: Image ghcr.io/bohdaq/hitop:launch-gate (cli/docker/Dockerfile, only on this runner)
        run: |
          mkdir -p image/amd64
          cp cli/target/x86_64-unknown-linux-musl/debug/hitop image/amd64/hitop
          docker build --build-arg TARGETARCH=amd64 -t ghcr.io/bohdaq/hitop:launch-gate -f cli/docker/Dockerfile image
          docker run --rm ghcr.io/bohdaq/hitop:launch-gate --version
      - name: Start the Staging and Local APIs
        run: |
          python3 cli/fixtures/launch-gate/mock_server.py 8781 staging "$STAGING_PASSWORD" &
          python3 cli/fixtures/launch-gate/mock_server.py 8782 local "$LOCAL_PASSWORD" &
          for port in 8781 8782; do
            for _ in $(seq 40); do curl -fs "http://127.0.0.1:$port/health" && break; sleep 0.25; done
          done
        env:
          STAGING_PASSWORD: launch-gate-staging-pw
          LOCAL_PASSWORD: launch-gate-local-pw
      - name: Import the Postman collection and environments in the container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e HITOP_KEYCHAIN=off -v "$PWD:/work" \
            ghcr.io/bohdaq/hitop:launch-gate import \
            cli/fixtures/launch-gate/shop.postman_collection.json \
            cli/fixtures/launch-gate/staging.postman_environment.json \
            cli/fixtures/launch-gate/local.postman_environment.json --to shop-api
          ls -R shop-api
      - name: Run on Staging (secret from the secrets input)
        id: staging
        uses: bohdaq/hitop-action@v1
        with:
          version: launch-gate
          path: shop-api
          env: Staging
          secrets: |
            password=launch-gate-staging-pw
          out: reports/staging
          artifact-name: launch-gate-staging
      - name: Switch to Local (secret from HITOP_SECRET_LOCAL_PASSWORD)
        id: local
        uses: bohdaq/hitop-action@v1
        env:
          HITOP_SECRET_LOCAL_PASSWORD: launch-gate-local-pw
        with:
          version: launch-gate
          path: shop-api
          env: Local
          out: reports/local
          artifact-name: launch-gate-local
      - name: The JUnit reports
        env:
          STAGING_EXIT: ${{ steps.staging.outputs.exit-code }}
          LOCAL_EXIT: ${{ steps.local.outputs.exit-code }}
        run: |
          test "$STAGING_EXIT" = 0
          test "$LOCAL_EXIT" = 0
          python3 cli/fixtures/launch-gate/check_junit.py reports/staging/junit.xml Staging 8781
          python3 cli/fixtures/launch-gate/check_junit.py reports/local/junit.xml Local 8782
          ! grep -r -e launch-gate-staging-pw -e launch-gate-local-pw reports

  extension:
    name: Browser extension build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:extension

  brand:
    name: Brand (icons from brand/logo.svg, one product name)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix brand
      - run: brand/check.sh

  desktop:
    name: Desktop app compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            cli/crates/hitop-wasm
      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Web app for the desktop (webapp, npm run build:tauri; the default frontend since HITOP Next T5)
        working-directory: webapp
        run: npm ci && npm run build:tauri
      - name: Desktop with the web app (tauri.conf.json)
        working-directory: desktop/src-tauri
        run: cargo check --locked
      - name: Old React frontend (tauri.react.conf.json, kept until the Mac App Store build moves)
        working-directory: desktop
        run: npm ci && npm run build
      - name: Desktop with the React frontend
        working-directory: desktop/src-tauri
        run: TAURI_CONFIG="$(cat tauri.react.conf.json)" cargo check --locked
      - name: Mac App Store configuration has no usage ping (no telemetry feature)
        working-directory: desktop/src-tauri
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          # The MAS build is a plain `tauri build`: the desktop crate without `telemetry`.
          cargo build --locked
          bin=target/debug/hitop-desktop
          for s in 'hitop.rws8.tech/api/ping' '/api/ping' 'HITOP_TELEMETRY_URL' 'telemetry.json'; do
            if grep -q -a -F "$s" "$bin"; then echo "MAS build contains '$s'"; exit 1; fi
          done
          # Control: the GitHub Release configuration (--features telemetry) has them.
          cargo build --locked --features telemetry
          for s in 'hitop.rws8.tech/api/ping' 'telemetry.json'; do
            grep -q -a -F "$s" "$bin" || { echo "control: telemetry build lacks '$s'"; exit 1; }
          done
          echo "MAS configuration: no ping code or endpoint; telemetry build: present"

  hitopkit:
    # ROADMAP T26: HitopKit, the iOS companion's Swift package (format reader, variables,
    # secrets, scripts, runner), tested on Linux in the official Swift image pinned by digest.
    # A hitop built from this commit runs the same folder for CLICompatibilityTests.
    name: HitopKit (Swift package for the iOS companion)
    runs-on: ubuntu-24.04
    env:
      SWIFT_IMAGE: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: Build hitop (for the CLI compatibility test)
        working-directory: cli
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked -p hitop
      - name: swift test (Swift 6.4.2; python3 for the mock server, node as the script engine)
        run: |
          docker run --rm -v "$PWD:/w" -w /w/ios/HitopKit -e HITOP_BIN=/w/cli/target/debug/hitop "$SWIFT_IMAGE" bash -euo pipefail -c '
            apt-get update -qq && apt-get install -y -qq python3 nodejs >/dev/null
            swift --version && node --version && python3 --version
            swift test 2>&1 | tee /tmp/swift-test.log
            if grep -E "Test Case .* skipped" /tmp/swift-test.log; then echo "tests were skipped"; exit 1; fi
          '

  desktop-macos:
    # The macOS-only code (src/bookmarks.rs: security-scoped bookmarks for the Mac App
    # Store sandbox, objc2) compiles only here. The MAS build is a plain `tauri build`.
    name: Desktop app compiles on macOS (MAS configuration)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Frontend (Tauri embeds ../dist)
        working-directory: desktop
        run: npm ci && npm run build
      - name: cargo check and clippy (no telemetry feature, as the MAS build)
        working-directory: desktop/src-tauri
        run: |
          cargo check --locked
          cargo clippy --locked -- -D warnings

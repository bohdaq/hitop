# HITOP for Android (android/, plan android/GOAL.md): hitop-ffi's Rust tests, the app built with
# hitop-ffi for arm64-v8a and x86_64 (cargo-ndk), core's JVM tests (with a host build of
# hitop-ffi), the Gradle dependency licence check, and the instrumented UI tests on an Android 12
# (API 31) and an Android 17 (API 37) emulator, with their screenshots (artifact "screenshots-api*").
name: Android

on:
  # Every push to main runs it (a docs-only commit too); branches run it through their pull request.
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "ios/HITOP/SyncFFI/**"
      - "cli/crates/hitop-core/**"
      - "cli/crates/hitop-sync-crypto/**"
      - "cli/Cargo.toml"
      - "shared/pm-shim.js"
      - "spec/**"
      - "brand/**"
      - "sync-server/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CARGO_NDK_VERSION: "4.1.2"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: hitop-ffi (cargo test, clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show && rustup component add clippy
        working-directory: cli
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: android/hitop-ffi
      - name: cargo test
        working-directory: android/hitop-ffi
        run: cargo test --locked
      - name: cargo clippy
        working-directory: android/hitop-ffi
        run: cargo clippy --locked --all-targets -- -D warnings

  app:
    name: App (build, JVM tests, licences, 16 KB pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Rust targets, NDK, cargo-ndk
        run: |
          (cd cli && rustup show)
          rustup target add aarch64-linux-android x86_64-linux-android
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            android/hitop-ffi
            sync-server
          key: android-ndk
      - name: hitop-ffi for arm64-v8a, x86_64 and the host
        working-directory: android
        run: |
          scripts/build-ffi.sh android arm64-v8a x86_64
          scripts/build-ffi.sh host
          ls -la build/ffi/jniLibs/* build/ffi/host
      - name: Sync server for core's end-to-end test (CloudEndToEndTest, required here)
        run: |
          cargo build --locked --manifest-path sync-server/Cargo.toml --bin hitop-sync-server
          echo "HITOP_SYNC_SERVER_BIN=$PWD/sync-server/target/debug/hitop-sync-server" >> "$GITHUB_ENV"
          echo "HITOP_E2E_REQUIRED=1" >> "$GITHUB_ENV"
      - name: 16 KB page alignment (Google Play)
        working-directory: android
        run: scripts/check-16k.sh build/ffi/jniLibs/*/libhitop_ffi.so
      - name: Gradle (core tests, licence check, lint, APKs)
        working-directory: android
        run: ./gradlew --stacktrace :core:test :app:licenseeDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: 16 KB alignment inside the APK
        working-directory: android
        run: scripts/check-16k.sh --apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: app-reports
          path: |
            android/core/build/reports
            android/app/build/reports
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jnilibs-x86_64
          path: android/build/ffi/jniLibs/x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ui-tests:
    name: UI tests (API ${{ matrix.api }})
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: "31"
            target: google_apis
            gpu: swiftshader_indirect
          # The AOSP image: on the Google APIs 37.0 image the app's data directory was missing when
          # the tests ran (every file write failed with ENOENT).
          - api: "37.0"
            target: default
            # On 37.0 system_server aborted taking a task snapshot (gfxstream assertion
            # !hasReadColorBufferDma) with SwiftShader and lavapipe alike (the image has no guest
            # renderer): the emulator's ReadColorBufferDma feature off.
            gpu: swiftshader_indirect -feature -ReadColorBufferDma
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jnilibs-x86_64
          path: android/build/ffi/jniLibs/x86_64
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the test APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      # The emulator sometimes refuses the action's first adb calls while it settles ("Failure calling
      # service input: Broken pipe"); one retry on a fresh emulator, never a retry of a failed test run.
      - name: Instrumented tests
        id: first
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none
          # Gradle turns animations off (testOptions.animationsDisabled).
          disable-animations: false
          working-directory: android
          # A test that ran and failed leaves tests-failed: then there is no retry (exit 2 = the
          # emulator never got ready, which is retried).
          script: scripts/run-ui-tests.sh || { [ $? -eq 2 ] || touch ../tests-failed; exit 1; }
      - name: Instrumented tests (retry)
        if: steps.first.outcome == 'failure' && hashFiles('tests-failed') == ''
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none
          # Gradle turns animations off (testOptions.animationsDisabled).
          disable-animations: false
          working-directory: android
          script: scripts/run-ui-tests.sh
      - name: Fail when the tests failed
        if: hashFiles('tests-failed') != ''
        run: exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-api${{ matrix.api }}
          path: android/app/build/outputs/connected_android_test_additional_output
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-test-reports-api${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore

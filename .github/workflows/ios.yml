# HITOP for iOS 26 (ios/HITOP, plan ios/HITOP_IOS.md): XcodeGen project, build, unit and UI tests
# on iOS 26 simulators, screenshots from the UI tests (artifact "screenshots"), and HitopKit's
# swift test on macOS (JavaScriptCore; ci.yml's hitopkit job runs it on Linux).
# I6: the App Store screenshots (job store-screenshots, artifact "app-store-screenshots") and the
# owner's App Store script up to a Release archive for a generic iOS device, unsigned (job archive).
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      # SyncFFI builds these into the app; the core job's end-to-end test runs the CLI.
      - "cli/crates/hitop-core/**"
      - "cli/crates/hitop-sync-crypto/**"
      - "cli/crates/hitop/src/commands/sync/**"
      # The I4 end-to-end test servers.
      - "cli/crates/hitop/examples/test_servers.rs"
      - "cli/crates/hitop/tests/support/ws_echo.rs"
      # hitop-core takes its dependencies from the cli workspace.
      - "cli/Cargo.toml"
      # RunsTests reads the spec's run report.
      - "spec/compat/v1/run-report/**"
  workflow_dispatch:
    inputs:
      runner:
        description: "github = GitHub's macos-26; macbook = the owner's self-hosted Mac (label hitop-mac: newer Xcode, no sudo; its job-started hook accepts only manual ios.yml runs started by the owner)"
        type: choice
        options: [github, macbook]
        default: github

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  app:
    name: HITOP app (build, unit + UI tests, screenshots)
    runs-on: ${{ inputs.runner == 'macbook' && fromJSON('["self-hosted", "macOS", "hitop-mac"]') || 'macos-26' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode 26 (newest installed)
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then xcode=/Applications/Xcode.app; fi
          # Self-hosted: no sudo; the Mac's selected Xcode is used.
          [ "$RUNNER_ENVIRONMENT" = self-hosted ] || sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: XcodeGen ${{ env.XCODEGEN_VERSION }} (checksum pinned)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: SyncFFI xcframework (Rust, device + simulator)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ffi-target
        run: |
          rustup show active-toolchain || rustup default stable
          ios/HITOP/scripts/build-sync-ffi.sh xcframework
          ls -R ios/HITOP/Vendor | head -20
          ls -la "$CARGO_TARGET_DIR"/aarch64-apple-ios/release/libhitop_sync_ffi.a "$CARGO_TARGET_DIR"/sim/libhitop_sync_ffi.a

      - name: Generate the project
        working-directory: ios/HITOP
        run: |
          xcodegen --version
          xcodegen generate
          ls

      - name: Pick iOS 26 simulators
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          def pick(prefs, family):
              found = []
              for runtime, devices in data["devices"].items():
                  if "iOS-26" not in runtime:
                      continue
                  for d in devices:
                      if d["name"].startswith(family):
                          found.append((runtime, d))
              found.sort(key=lambda x: x[0], reverse=True)
              for p in prefs:
                  for runtime, d in found:
                      if d["name"] == p:
                          return d
              return found[0][1]
          phone = pick(["iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro"], "iPhone")
          # 11-inch: 1180 x 820 points in landscape, the drafts' iPad size.
          pad = pick(["iPad Air 11-inch (M3)", "iPad Air 11-inch (M2)", "iPad Pro 11-inch (M4)"], "iPad")
          print(f"PHONE_ID={phone['udid']}")
          print(f"PHONE_NAME={phone['name']}")
          print(f"PAD_ID={pad['udid']}")
          print(f"PAD_NAME={pad['name']}")
          PY
          cat "$GITHUB_ENV"

      - name: Build for testing
        working-directory: ios/HITOP
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project HITOPApp.xcodeproj -scheme HITOP \
            -destination "id=$PHONE_ID" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*HITOP|BUILD (SUCCEEDED|FAILED)" || true
          if grep -q "BUILD FAILED\|TEST BUILD FAILED\|\*\* TEST BUILD FAILED" "$RUNNER_TEMP/build.log"; then
            { echo '### Build errors'; echo '```'; grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Unit and UI tests (${{ env.PHONE_NAME }})
        working-directory: ios/HITOP
        run: |
          set -o pipefail
          # Booted first: a cold simulator can time out the app launch.
          xcrun simctl boot "$PHONE_ID" || true
          xcrun simctl bootstatus "$PHONE_ID" -b
          xcodebuild test-without-building -project HITOPApp.xcodeproj -scheme HITOP \
            -destination "id=$PHONE_ID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -skip-testing:HITOPUITests/StoreScreenshotTests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/phone.xcresult" 2>&1 | tee "$RUNNER_TEMP/test-phone.log" \
            | grep -E "Test Case|error:|failed|TEST (SUCCEEDED|FAILED)|Executed" || true
          if ! grep -q "TEST EXECUTE SUCCEEDED\|TEST SUCCEEDED" "$RUNNER_TEMP/test-phone.log"; then
            { echo '### iPhone test failures'; echo '```'; grep -E "error:|failed" "$RUNNER_TEMP/test-phone.log" | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: iPad screenshots (${{ env.PAD_NAME }})
        if: success() || failure()
        working-directory: ios/HITOP
        run: |
          set -o pipefail
          xcrun simctl shutdown "$PHONE_ID" || true
          xcrun simctl boot "$PAD_ID" || true
          xcrun simctl bootstatus "$PAD_ID" -b
          xcodebuild test-without-building -project HITOPApp.xcodeproj -scheme HITOP \
            -destination "id=$PAD_ID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:HITOPUITests/ScreenshotTests -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$RUNNER_TEMP/pad.xcresult" 2>&1 | tee "$RUNNER_TEMP/test-pad.log" \
            | grep -E "Test Case|error:|failed|TEST (SUCCEEDED|FAILED)|Executed" || true
          if ! grep -q "TEST EXECUTE SUCCEEDED\|TEST SUCCEEDED" "$RUNNER_TEMP/test-pad.log"; then
            { echo '### iPad test failures'; echo '```'; grep -E "error:|failed" "$RUNNER_TEMP/test-pad.log" | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          for r in phone pad; do
            [ -d "$RUNNER_TEMP/$r.xcresult" ] || continue
            out="$RUNNER_TEMP/export-$r"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$r.xcresult" --output-path "$out" || continue
            python3 - "$out" "$RUNNER_TEMP/shots" "$r" <<'PY'
          import json, os, re, shutil, sys
          src, dst, device = sys.argv[1:]
          for test in json.load(open(os.path.join(src, "manifest.json"))):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  base = name.split("_0_")[0].rsplit(".", 1)[0]
                  ext = os.path.splitext(a["exportedFileName"])[1] or ".png"
                  if base[:2].isdigit():
                      out = f"{device}-{base}{ext}"
                  else:
                      # XCTest's own screenshots (failures): kept under failures/, names made safe.
                      test_name = re.sub(r"[^A-Za-z0-9_-]+", "-", test.get("testIdentifier", "test"))
                      os.makedirs(os.path.join(dst, "failures"), exist_ok=True)
                      out = os.path.join("failures", f"{device}-{test_name}-{re.sub(r'[^A-Za-z0-9_-]+', '-', base)}{ext}")
                  shutil.copy(os.path.join(src, a["exportedFileName"]), os.path.join(dst, out))
          PY
          done
          # The iPad screen capture comes in the panel's portrait orientation: turn it upright.
          for f in "$RUNNER_TEMP"/shots/pad-[0-9]*.png; do
            [ -f "$f" ] || continue
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')
            if [ "$h" -gt "$w" ]; then sips -r 270 "$f" >/dev/null; fi
          done
          ls -laR "$RUNNER_TEMP/shots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore

  # App Store screenshots (I6, ios/APP_STORE.md): UITests/StoreScreenshotTests on a 6.9" iPhone and a
  # 13" iPad simulator (made here from their device types), status bar at 9:41, exported as
  # iphone/NN-….png and ipad/NN-….png in upload order, flattened (no alpha), sizes checked against App Store Connect's.
  store-screenshots:
    name: App Store screenshots (iPhone 6.9", iPad 13")
    runs-on: ${{ inputs.runner == 'macbook' && fromJSON('["self-hosted", "macOS", "hitop-mac"]') || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26 + XcodeGen
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ] && [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: SyncFFI xcframework + project
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ffi-target
        run: |
          rustup show active-toolchain || rustup default stable
          ios/HITOP/scripts/build-sync-ffi.sh xcframework
          (cd ios/HITOP && xcodegen generate)
      - name: Store simulators (iPhone 6.9", iPad 13")
        run: python3 ios/HITOP/scripts/store-simulators.py >> "$GITHUB_ENV" && cat "$GITHUB_ENV"
      - name: Build for testing
        working-directory: ios/HITOP
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project HITOPApp.xcodeproj -scheme HITOP \
            -destination "id=$STORE_PHONE_ID" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          if grep -q "BUILD FAILED" "$RUNNER_TEMP/build.log"; then exit 1; fi
      - name: Screenshots (${{ env.STORE_PHONE_NAME }}, ${{ env.STORE_PAD_NAME }})
        working-directory: ios/HITOP
        run: |
          set -o pipefail
          status=0
          for d in phone pad; do
            if [ $d = phone ]; then id=$STORE_PHONE_ID; else id=$STORE_PAD_ID; fi
            xcrun simctl boot "$id" || true
            xcrun simctl bootstatus "$id" -b
            xcrun simctl status_bar "$id" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcodebuild test-without-building -project HITOPApp.xcodeproj -scheme HITOP \
              -destination "id=$id" -derivedDataPath "$RUNNER_TEMP/dd" \
              -only-testing:HITOPUITests/StoreScreenshotTests -retry-tests-on-failure -test-iterations 2 \
              -resultBundlePath "$RUNNER_TEMP/store-$d.xcresult" 2>&1 | tee "$RUNNER_TEMP/store-$d.log" \
              | grep -E "Test Case|error:|failed|TEST (SUCCEEDED|FAILED)|Executed" || true
            if ! grep -q "TEST EXECUTE SUCCEEDED\|TEST SUCCEEDED" "$RUNNER_TEMP/store-$d.log"; then
              { echo "### Store screenshot failures ($d)"; echo '```'; grep -E "error:|failed" "$RUNNER_TEMP/store-$d.log" | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
            xcrun simctl shutdown "$id" || true
          done
          exit $status
      - name: Export, flatten and check sizes
        if: success() || failure()
        run: |
          out="$RUNNER_TEMP/store"
          mkdir -p "$out"
          for d in phone pad; do
            [ -d "$RUNNER_TEMP/store-$d.xcresult" ] || continue
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/store-$d.xcresult" --output-path "$RUNNER_TEMP/store-export-$d"
            python3 ios/HITOP/scripts/store-screenshots.py "$RUNNER_TEMP/store-export-$d" "$out"
          done
          # iPad captures come in the panel's portrait orientation: upright (landscape).
          for f in "$out"/ipad/*.png; do
            [ -f "$f" ] || continue
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')
            if [ "$h" -gt "$w" ]; then sips -r 270 "$f" >/dev/null; fi
          done
          sips -g hasAlpha "$out"/*/*.png | grep hasAlpha | sort | uniq -c || true
          swift ios/HITOP/scripts/flatten-png.swift "$out"/*/*.png
          ios/HITOP/scripts/check-store-screenshots.sh "$out" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: app-store-screenshots
          path: ${{ runner.temp }}/store
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: store-logs
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/store-*.xcresult
          if-no-files-found: ignore

  # The owner's App Store script (ios/HITOP/scripts/build-appstore.sh) up to the archive: Release,
  # generic iOS device, unsigned (no secrets here), then its version, bundle and store-mode checks.
  # Signing, export and upload run only on the owner's Mac.
  archive:
    name: App Store archive (Release, generic iOS, unsigned)
    runs-on: ${{ inputs.runner == 'macbook' && fromJSON('["self-hosted", "macOS", "hitop-mac"]') || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26 + XcodeGen
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ] && [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then sudo xcode-select -s "$xcode"; fi
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: build-appstore.sh 2 --unsigned
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ffi-target
        run: |
          rustup show active-toolchain || rustup default stable
          ios/HITOP/scripts/build-appstore.sh 2 --unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: archive-log
          path: ios/HITOP/build/archive.log
          if-no-files-found: ignore

  core:
    name: App/Core swift test + end-to-end against a real sync server
    runs-on: ${{ inputs.runner == 'macbook' && fromJSON('["self-hosted", "macOS", "hitop-mac"]') || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ] && [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - name: Build hitop-sync-server
        working-directory: sync-server
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          rustup show active-toolchain || rustup default stable
          cargo build --locked --bin hitop-sync-server
      - name: Build the hitop CLI (the second client of the shared-collection end-to-end test)
        working-directory: cli
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked -p hitop --bin hitop
      - name: Build the local WebSocket, SSE and gRPC test servers (I4 end-to-end tests)
        working-directory: cli
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked -p hitop --example test_servers
      - name: swift test (App/Core + UnitTests, CloudEndToEndTests required)
        env:
          HITOP_SYNC_SERVER_BIN: ${{ github.workspace }}/sync-server/target/debug/hitop-sync-server
          HITOP_BIN: ${{ github.workspace }}/cli/target/debug/hitop
          HITOP_TEST_SERVERS_BIN: ${{ github.workspace }}/cli/target/debug/examples/test_servers
          CARGO_TARGET_DIR: ${{ runner.temp }}/ffi-target
          HITOP_E2E_REQUIRED: "1"
        run: ios/HITOP/scripts/core-tests.sh

  # What gRPC (SyncFFI feature `grpc`: hitop-core's tonic client) adds to the app: the Release
  # device binary with and without it, and the native libraries the static library needs.
  # Manual runs only (Actions → iOS → Run workflow), as it builds the app twice.
  size:
    name: App size with and without gRPC (Release, device)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner == 'macbook' && fromJSON('["self-hosted", "macOS", "hitop-mac"]') || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26 + XcodeGen
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ] && [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then sudo xcode-select -s "$xcode"; fi
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build both ways
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ffi-target
        run: |
          rustup show active-toolchain || rustup default stable
          rustup target add aarch64-apple-ios
          (cd ios/HITOP/SyncFFI && cargo rustc --locked --release --target aarch64-apple-ios --lib --crate-type staticlib -- --print native-static-libs 2>&1 | grep -i "native-static-libs" || true)
          measure() {
            ios/HITOP/scripts/build-sync-ffi.sh xcframework
            (cd ios/HITOP && xcodegen generate >/dev/null && xcodebuild build -project HITOPApp.xcodeproj -scheme HITOP -configuration Release \
              -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/dd-$1" CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)")
            app="$RUNNER_TEMP/dd-$1/Build/Products/Release-iphoneos/HITOP.app"
            bytes=$(stat -f %z "$app/HITOP")
            all=$(du -sk "$app" | cut -f1)
            echo "$1: HITOP binary $bytes bytes, HITOP.app ${all} KB" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          measure grpc
          SYNC_FFI_CARGO_FLAGS=--no-default-features measure no-grpc

  hitopkit:
    name: HitopKit swift test (macOS, JavaScriptCore)
    runs-on: ${{ inputs.runner == 'macbook' && fromJSON('["self-hosted", "macOS", "hitop-mac"]') || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ] && [ "$RUNNER_ENVIRONMENT" != self-hosted ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - name: swift test
        working-directory: ios/HitopKit
        run: swift test

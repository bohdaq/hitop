name: Release desktop

# A tag like desktop-v0.2.0 builds the free, unsigned desktop app for macOS (universal, ad-hoc
# signed), Windows and Linux and attaches it to a GitHub Release. Tags with a suffix
# (desktop-v0.2.0-rc.1) make a pre-release and skip the version check: use them as dry runs.
# Mac App Store builds are separate: the owner builds them on a Mac with tauri.conf.json as is.
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  check:
    name: Tag and version
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          tag="${GITHUB_REF_NAME#desktop-v}"
          if [ "$tag" != "${tag%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            test "$tag" = "$version" || { echo "tag $GITHUB_REF_NAME, tauri.conf.json $version"; exit 1; }
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [ "${{ steps.v.outputs.prerelease }}" = true ] && flags="--prerelease"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" $flags \
            --title "HITOP desktop ${GITHUB_REF_NAME#desktop-v}" --notes-file .github/release-desktop-notes.md

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-2022
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - working-directory: desktop
        run: npm ci
      # GitHub builds load the Lit web app (webapp/, built by beforeBuildCommand in
      # tauri.github.conf.json). The Mac App Store build keeps desktop/src until the owner's macOS check.
      - working-directory: webapp
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: HITOP desktop ${{ github.ref_name }}
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          # GitHub Release builds carry the opt-in usage ping; the Mac App Store build doesn't.
          args: ${{ matrix.args }} --config src-tauri/tauri.github.conf.json --features telemetry

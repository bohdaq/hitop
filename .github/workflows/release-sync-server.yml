name: Release sync server image

# HITOP Cloud C6 (spec/CLOUD_SERVICE.md): the enterprise self-host package's signed image. The
# same release tags as the CLI (cli-v<version>) build ghcr.io/bohdaq/hitop-sync-server:<version>
# (SQLite and Postgres, linux/amd64), sign it with cosign keyless (GitHub OIDC → Fulcio, logged in
# Rekor), attach an SPDX SBOM attestation, verify the signature and smoke-test the image
# (/healthz on a fresh volume). `latest` only for tags without a suffix; rc tags push the rc
# version only. The image tag is the release version; the server reports its own crate version
# and schema on /healthz.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  image:
    name: Image ghcr.io/bohdaq/hitop-sync-server (signed)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's OIDC token identifies it to Fulcio.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from the tag
        run: |
          v="${GITHUB_REF_NAME#cli-v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        run: |
          image=ghcr.io/bohdaq/hitop-sync-server
          tags="$image:${{ steps.v.outputs.version }}"
          if [ "${{ steps.v.outputs.prerelease }}" != true ]; then tags="$tags,$image:latest"; fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sync-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/bohdaq/hitop
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=HITOP sync server
            org.opencontainers.image.description=hitop sync server: end-to-end encrypted workspaces, SQLite or Postgres
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Sign the image and attest its SBOM (keyless)
        env:
          REF: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - name: Verify the signature (what a customer runs)
        env:
          REF: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-sync-server.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation --type spdxjson "$REF" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release-sync-server.yml@${{ github.ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: The image serves /healthz on a fresh volume
        run: sync-server/deploy/image-smoke.sh "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}"

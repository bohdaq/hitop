# Dependency licenses for every Rust workspace (policy in deny.toml).
name: Licenses

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace: [cli, cli/crates/hitop-wasm, server, desktop/src-tauri]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --config deny.toml --manifest-path ${{ matrix.workspace }}/Cargo.toml check licenses

  # sync-server/ is AGPL-3.0-or-later: its own policy (AGPL-compatible licenses) for the server,
  # and the MIT policy for the MIT client crate it contains (crates/hitop-sync-crypto).
  sync-server:
    name: cargo deny (sync-server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: server (AGPL policy, licenses and advisories)
        run: cargo deny --config sync-server/deny.toml --manifest-path sync-server/Cargo.toml --workspace check licenses advisories
      - name: hitop-sync-crypto (MIT policy)
        run: cargo deny --config deny.toml --manifest-path sync-server/Cargo.toml --workspace --exclude hitop-sync-server check licenses

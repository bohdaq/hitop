# Dependency licenses and security advisories for every Rust workspace (policy and
# documented advisory ignores in deny.toml, sync-server/deny.toml), and npm audit for
# every npm package that ships (frontend/ is the frozen extension build, not audited here).
name: Licenses and advisories

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny (${{ matrix.workspace }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace: [cli, cli/crates/hitop-wasm, server, desktop/src-tauri]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --config deny.toml --manifest-path ${{ matrix.workspace }}/Cargo.toml check licenses advisories

  # sync-server/ is AGPL-3.0-or-later: its own policy (AGPL-compatible licenses). The MIT client
  # crate it tests against (cli/crates/hitop-sync-crypto) is in the cli workspace, so the MIT
  # policy above checks it.
  sync-server:
    name: cargo deny (sync-server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: server (AGPL policy, licenses and advisories)
        run: cargo deny --config sync-server/deny.toml --manifest-path sync-server/Cargo.toml --workspace check licenses advisories

  npm-audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [desktop, webapp, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Production dependencies only (what reaches users); any advisory fails the job.
      - run: npm audit --omit=dev --audit-level=low
        working-directory: ${{ matrix.package }}

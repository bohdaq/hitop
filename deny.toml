# cargo deny check licenses, run in CI for every Rust workspace:
#   cargo deny --config deny.toml --manifest-path <workspace>/Cargo.toml check licenses
# Everything here except sync-server/ is MIT, so dependencies must be permissively licensed
# (MPL-2.0 is file-level copyleft and fine to link). No GPL or AGPL crates.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
# The allow list covers all workspaces; not every one uses every license.
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]

[licenses.private]
# Our own unpublished crates (desktop, server) are checked through their dependencies.
ignore = true

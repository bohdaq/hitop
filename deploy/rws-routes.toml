# Added to /etc/rws/rws.config.toml on bohdan-prod-donotdelete, ABOVE the
# old-docs-* redirect routes (those match any host). Nothing existing changes.
#
# [acme] domains: append "hitop.168-119-17-57.sslip.io" first. Append
# "hitop.rws8.tech" only after its DNS A record points at 168.119.17.57: every
# name shares one certificate (mail.rws8.tech too), so a name that fails
# validation fails the whole order.

[[upstream]]
name     = "hitop"
backends = ["127.0.0.1:7880"]

# The request proxy: per client IP limits here, hitop-server only sees 127.0.0.1.
[[route]]
  name = "hitop-proxy"

  [route.match]
  host = "hitop.rws8.tech"
  path = "/api/*"

  [route.action]
  type     = "proxy"
  upstream = "hitop"

  [route.middleware]
  rate_limit = { max_requests = 60, window_secs = 60 }

[[route]]
  name = "hitop-site"

  [route.match]
  host = "hitop.rws8.tech"
  path = "/*"

  [route.action]
  type     = "proxy"
  upstream = "hitop"

# The same two routes for the staging name, used to test before DNS moves.
[[route]]
  name = "hitop-proxy-staging"

  [route.match]
  host = "hitop.168-119-17-57.sslip.io"
  path = "/api/*"

  [route.action]
  type     = "proxy"
  upstream = "hitop"

  [route.middleware]
  rate_limit = { max_requests = 60, window_secs = 60 }

[[route]]
  name = "hitop-site-staging"

  [route.match]
  host = "hitop.168-119-17-57.sslip.io"
  path = "/*"

  [route.action]
  type     = "proxy"
  upstream = "hitop"

# HITOP Cloud portal (spec/CLOUD_SERVICE.md C1): static files in hitop-server's www/cloud/.
# The route adds the /cloud prefix, so cloud.hitop.rws8.tech/ is www/cloud/index.html and
# /healthz is www/cloud/healthz. Add it with the others (above the old-docs-* routes). Append
# "cloud.hitop.rws8.tech" to [acme] domains only after the owner's DNS A record for it points at
# 168.119.17.57 (one shared certificate: a name that fails validation fails the whole order).
# Until then the same files answer at https://hitop.rws8.tech/cloud/.
[[route]]
  name = "hitop-cloud"

  [route.match]
  host = "cloud.hitop.rws8.tech"
  path = "/*"

  [route.action]
  type = "proxy"

  [route.action.proxy]
  upstream        = "hitop"
  add_path_prefix = "/cloud"

  [route.middleware]
  rate_limit = { max_requests = 120, window_secs = 60 }

  # The portal loads only its own files; it talks to sync servers over https (?server= picks a
  # self-hosted one) and to a local server in development. 'wasm-unsafe-eval': the password
  # crypto (hitop-sync-crypto in WebAssembly) compiles under this policy. The portal's e2e suite
  # (cloud/portal/tests/e2e.cjs) serves the portal with this exact header and fails on a violation.
  [[route.middleware.rewrite.response]]
  type  = "header_set"
  name  = "Content-Security-Policy"
  value = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: https://hitop.rws8.tech; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"

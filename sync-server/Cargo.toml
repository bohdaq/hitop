[workspace]
members = ["."]
resolver = "2"

[package]
name = "hitop-sync-server"
version = "0.1.0"
edition = "2021"
authors = ["Bohdan Tsap <bohdaq@gmail.com>"]
license = "AGPL-3.0-or-later"
description = "hitop sync server: stores end-to-end encrypted workspace blobs, version vectors and wrapped keys"
publish = false

[features]
default = []
# Postgres as the database (HITOP_SYNC_DATABASE=postgres://...). SQLite is always built in.
postgres = ["dep:postgres"]

[dependencies]
rust-web-server = { version = "18.14", default-features = false, features = ["http2", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
postgres = { version = "0.19", optional = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
webauthn-rs = "0.6"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Passwords (password.rs): the server's own Argon2id hash of the clients' auth keys.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
# HITOP Cloud C5 (already in the tree through lettre's `ring` feature): AES-256-GCM for the
# server's own secrets at rest under the host key (per-org OIDC client secrets, hostkey.rs) and
# Ed25519 for signed audit exports and daily anchors (anchors.rs). Never client data.
ring = "0.17.14"

[dev-dependencies]
# Tests act as the clients: they encrypt with the client crate and check the server only ever
# holds ciphertext. The server itself never links it (see tests/no_crypto_in_server.rs).
hitop-sync-crypto = { path = "../cli/crates/hitop-sync-crypto" }
webauthn-authenticator-rs = { version = "0.6", default-features = false, features = ["softpasskey"] }

[profile.release]
lto = true
strip = true

# Argon2 unoptimized makes every password test take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

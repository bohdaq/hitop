# HITOP Cloud C2 on the shared VM: the hitop Postgres cluster only (cloud/ops/install.sh installs
# this as /etc/systemd/system/postgresql@<major>-hitop.service.d/10-hitop-limits.conf; any other
# cluster on the host is untouched). shared_buffers is 128 MB (postgres-setup.sh), 20 connections.
# Only resource limits: the distribution's unit runs pg_ctlcluster, which further sandboxing breaks.
[Service]
CPUQuota=100%
CPUWeight=50
IOWeight=50
MemoryHigh=768M
MemoryMax=1G
TasksMax=256

# HITOP Cloud C2 on the shared VM (installed by cloud/ops/install.sh to
# /etc/systemd/system/hitop-sync.service.d/): the sync server can't starve the neighbours (mail,
# Gitea, other sites), and they win under contention (CPUWeight/IOWeight below the default 100).
# Tune the numbers here, then: systemctl daemon-reload && systemctl restart hitop-sync.
[Service]
CPUQuota=100%
CPUWeight=50
IOWeight=50
MemoryHigh=400M
MemoryMax=512M
MemorySwapMax=128M
TasksMax=1024
LimitNOFILE=16384

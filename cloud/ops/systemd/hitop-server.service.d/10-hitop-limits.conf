# HITOP Cloud C2 on the shared VM (installed by cloud/ops/install.sh to
# /etc/systemd/system/hitop-server.service.d/): the site, web app and request proxy. Proxied
# responses are bounded by the server, so a gigabyte is plenty; neighbours win under contention.
[Service]
CPUQuota=100%
CPUWeight=50
IOWeight=50
MemoryHigh=768M
MemoryMax=1G
MemorySwapMax=128M
TasksMax=512
LimitNOFILE=16384
